[workspace]
name = "loch"
channels = ["conda-forge", "openbiosim/label/dev"]
# No Windows - pycuda/pyopencl only available on linux-64
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.10"
biosimspace = "*"
loguru = "*"
pyopencl = "*"

[target.linux-64.dependencies]
pycuda = "*"

[feature.test.dependencies]
pytest = "*"
black = "*"

[environments]
default = []
test = ["test"]
dev = ["test"]
