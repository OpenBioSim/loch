[workspace]
name = "loch"
channels = ["conda-forge", "openbiosim/label/dev"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
biosimspace = "*"
loguru = "*"
pyopencl = "*"

[target.linux-64.dependencies]
pycuda = "*"

[target.win-64.dependencies]
pycuda = "*"

[feature.test.dependencies]
pytest = "*"

[feature.lint.dependencies]
pre-commit = "*"
rattler-build = "*"
ruff = "*"

[environments]
default = []
test = ["test"]
dev = ["test", "lint"]
